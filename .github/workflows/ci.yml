name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build and browser checks (${{ matrix.viewport }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Verify the production build on desktop and mobile
        env:
          GALLERY_URL: http://127.0.0.1:4173/
          GALLERY_VIEWPORT: ${{ matrix.viewport }}
        run: |
          mkdir -p test-results
          pnpm preview --host 127.0.0.1 --port 4173 --strictPort > test-results/preview.log 2>&1 &
          gallery_pid=$!
          trap 'kill "$gallery_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$GALLERY_URL" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$GALLERY_URL" > /dev/null
          pnpm verify
      - name: Upload screenshots and verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery-verification-${{ matrix.viewport }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
